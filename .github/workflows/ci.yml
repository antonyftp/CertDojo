# CI required by SPECIFICATIONS.md §7: lint, tests, and content validation on
# every pull request (plus pushes to main so the badge reflects the trunk).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, typecheck, content, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm validate-content

      - run: pnpm test

      # `tsc --noEmit` does not catch everything a real build does (bundler
      # errors, client/server import violations, static generation failures),
      # so the production build is its own gate.
      - run: pnpm build

  # The app's production mode is Postgres (Vercel/Neon), but every other test
  # runs on SQLite. This job is the only place the Postgres dialect — the
  # generated DDL and the upsert shapes used by restore.ts and submitAnswer —
  # is actually executed. Without TEST_POSTGRES_URL those tests self-skip, so
  # they only really run here.
  postgres:
    name: Postgres dialect tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: certdojo
          POSTGRES_PASSWORD: certdojo
          POSTGRES_DB: certdojo_test
        ports:
          - 5432:5432
        # Without this the job can start querying before the server accepts
        # connections; the service is only reported healthy once pg_isready
        # succeeds.
        options: >-
          --health-cmd "pg_isready -U certdojo -d certdojo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm vitest run src/db/postgres-dialect.test.ts
        env:
          TEST_POSTGRES_URL: postgres://certdojo:certdojo@localhost:5432/certdojo_test
          # Turns a missing database into a failure instead of a silent skip.
          REQUIRE_POSTGRES_TESTS: "1"

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
