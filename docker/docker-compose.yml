name: certdojo

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      SQLITE_PATH: /app/data/certdojo.db
    volumes:
      # Named volume so the SQLite database survives container restarts,
      # rebuilds, and `docker compose down` (removed only with `down -v`).
      - certdojo-data:/app/data

volumes:
  certdojo-data:
